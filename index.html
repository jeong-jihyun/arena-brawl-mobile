<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101827"><title>ARENA BRAWL</title><link rel="manifest" href="manifest.webmanifest"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101827;color:#fff;font-family:system-ui;touch-action:none}canvas{display:block;width:100vw;height:100dvh}#hud{position:fixed;inset:10px 12px auto;display:flex;justify-content:space-between;pointer-events:none;font-weight:800;text-shadow:0 2px 4px #000}.pill{background:#101827cc;border:1px solid #ffffff40;border-radius:12px;padding:8px}#controls{position:fixed;inset:0;pointer-events:none}#stick{position:absolute;left:22px;bottom:24px;width:118px;height:118px;border-radius:50%;background:#d8ecff20;border:2px solid #ffffff55;pointer-events:auto;touch-action:none}#knob{position:absolute;width:48px;height:48px;left:33px;top:33px;border-radius:50%;background:#e9f5ffb8;border:2px solid white}.action{position:absolute;right:25px;bottom:30px;width:82px;height:82px;border-radius:50%;display:grid;place-items:center;font-weight:900;border:3px solid #fff9;background:linear-gradient(#ffb347,#e75c27);pointer-events:auto;touch-action:none;user-select:none}#special{right:122px;bottom:40px;width:66px;height:66px;background:linear-gradient(#b78cff,#673bd4);font-size:12px}#overlay{position:fixed;inset:0;display:grid;place-items:center;background:#09111ddd;text-align:center;padding:24px}.panel{width:min(92vw,430px);padding:26px 22px;border:1px solid #ffffff30;border-radius:24px;background:linear-gradient(145deg,#223d55,#111b2b)}h1{font-size:clamp(30px,8vw,48px);margin:0 0 8px}p{color:#c9d8e7;line-height:1.5}button{border:0;border-radius:14px;padding:14px 24px;font-size:17px;font-weight:900;background:linear-gradient(90deg,#ffe17a,#ff9f43)}small{display:block;color:#aebfd0;margin-top:16px}</style></head><body><canvas id="game"></canvas><div id="hud"><div class="pill">❤️ <span id="hp">100</span></div><div class="pill">⭐ <span id="score">0</span></div><div class="pill">적 <span id="left">5</span></div></div><div id="controls"><div id="stick"><div id="knob"></div></div><div class="action" id="special">특수기</div><div class="action" id="attack">공격</div></div><div id="overlay"><div class="panel"><h1>ARENA BRAWL</h1><p id="intro">로봇 5대를 물리치세요.<br>왼쪽 조이스틱으로 이동, 공격 버튼으로 발사하세요.</p><button id="start">전투 시작</button><small>오리지널 모바일 아레나 슈팅 프로토타입</small></div></div><script>(()=>{const c=document.querySelector('canvas'),x=c.getContext('2d'),$=id=>document.getElementById(id);let W,H,d=1,world={w:1000,h:700},p,b=[],s=[],score=0,run=false,last=0,held=false,m={x:0,y:0},ready=true,keys={};function size(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(d,0,0,d,0,0)}addEventListener('resize',size);size();const rnd=(a,z)=>a+Math.random()*(z-a),cl=(v,a,z)=>Math.max(a,Math.min(z,v));function reset(){p={x:500,y:350,r:20,hp:100,speed:240,angle:0,cool:0,inv:0};b=[];s=[];score=0;ready=true;for(let i=0;i<5;i++){let a=i*Math.PI*2/5;b.push({x:500+Math.cos(a)*rnd(220,300),y:350+Math.sin(a)*rnd(170,240),r:19,hp:65,max:65,speed:rnd(75,105),cool:rnd(.2,1),phase:rnd(0,6)})}hud()}function hud(){$('hp').textContent=Math.max(0,Math.ceil(p.hp));$('score').textContent=score;$('left').textContent=b.length}const blocks=[[200,150,100,70],[700,150,110,70],[190,490,110,75],[710,480,100,85],[450,80,100,50],[450,570,110,50]];function blocked(a,z,r){return blocks.some(([bx,by,bw,bh])=>a+r>bx&&a-r<bx+bw&&z+r>by&&z-r<by+bh)}function shot(a,t,team,damage,speed){let dx=t.x-a.x,dy=t.y-a.y,l=Math.hypot(dx,dy)||1;s.push({x:a.x,y:a.y,vx:dx/l*speed,vy:dy/l*speed,life:1.5,team,damage})}function fire(){if(!run||p.cool>0||!b.length)return;let t=b.reduce((a,z)=>!a||Math.hypot(z.x-p.x,z.y-p.y)<Math.hypot(a.x-p.x,a.y-p.y)?z:a,null);p.angle=Math.atan2(t.y-p.y,t.x-p.x);shot(p,t,'p',24,560);p.cool=.28}function special(){if(!run||!ready)return;ready=false;for(let z of b)if(Math.hypot(z.x-p.x,z.y-p.y)<230)z.hp-=48;b=b.filter(z=>{if(z.hp<=0){score+=100;return false}return true});hud();$('special').textContent='충전중';setTimeout(()=>{ready=true;$('special').textContent='특수기'},5000)}function update(dt){if(!run)return;let mx=m.x+(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),my=m.y+(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0),l=Math.hypot(mx,my)||1,nx=cl(p.x+mx/l*p.speed*dt,30,970),ny=cl(p.y+my/l*p.speed*dt,30,670);if(!blocked(nx,p.y,p.r))p.x=nx;if(!blocked(p.x,ny,p.r))p.y=ny;p.cool=Math.max(0,p.cool-dt);p.inv=Math.max(0,p.inv-dt);if(held)fire();for(let z of b){let dx=p.x-z.x,dy=p.y-z.y,r=Math.hypot(dx,dy)||1;z.phase+=dt;if(r>125){let nx=cl(z.x+dx/r*z.speed*dt,30,970),ny=cl(z.y+dy/r*z.speed*dt,30,670);if(!blocked(nx,z.y,z.r))z.x=nx;if(!blocked(z.x,ny,z.r))z.y=ny}else{z.x+=Math.sin(z.phase*2)*25*dt;z.y+=Math.cos(z.phase*2)*25*dt}z.cool-=dt;if(r<440&&z.cool<=0){shot(z,p,'e',9,300);z.cool=rnd(1,1.7)}}for(let q of s){q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;if(q.team==='p'){for(let z of b)if(Math.hypot(q.x-z.x,q.y-z.y)<z.r+7){z.hp-=q.damage;q.life=0;if(z.hp<=0)score+=100;break}}else if(Math.hypot(q.x-p.x,q.y-p.y)<p.r+7&&p.inv<=0){p.hp-=9;p.inv=.35;q.life=0}}s=s.filter(q=>q.life>0&&q.x>0&&q.y>0&&q.x<1000&&q.y<700);b=b.filter(z=>z.hp>0);hud();if(p.hp<=0)end(false);else if(!b.length)end(true)}function draw(){x.clearRect(0,0,W,H);let sc=Math.min(W/1000,H/700),ox=(W-1000*sc)/2,oy=(H-700*sc)/2;x.save();x.translate(ox,oy);x.scale(sc,sc);x.fillStyle='#20384a';x.fillRect(0,0,1000,700);x.strokeStyle='#ffffff0c';for(let a=0;a<1000;a+=50){x.beginPath();x.moveTo(a,0);x.lineTo(a,700);x.stroke()}for(let z=0;z<700;z+=50){x.beginPath();x.moveTo(0,z);x.lineTo(1000,z);x.stroke()}x.strokeStyle='#77c9d9';x.lineWidth=8;x.strokeRect(5,5,990,690);for(let [a,z,w,h]of blocks){x.fillStyle='#526b72';x.fillRect(a,z,w,h);x.fillStyle='#78939a';x.fillRect(a+4,z+4,w-8,9)}for(let q of s){x.fillStyle=q.team==='p'?'#ffe17a':'#ff6c79';x.beginPath();x.arc(q.x,q.y,6,0,7);x.fill()}for(let z of b){x.fillStyle='#40233a';x.beginPath();x.arc(z.x,z.y,z.r+4,0,7);x.fill();x.fillStyle='#ed6682';x.beginPath();x.arc(z.x,z.y,z.r,0,7);x.fill();x.fillStyle='#fff';x.fillRect(z.x-8,z.y-5,5,5);x.fillRect(z.x+3,z.y-5,5,5);x.fillStyle='#301a2b';x.fillRect(z.x-19,z.y-30,38,5);x.fillStyle='#75e58e';x.fillRect(z.x-19,z.y-30,38*z.hp/z.max,5)}x.fillStyle='#173e54';x.beginPath();x.arc(p.x,p.y,p.r+5,0,7);x.fill();x.fillStyle='#4bc7f2';x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();x.save();x.translate(p.x,p.y);x.rotate(p.angle);x.fillStyle='#eafaff';x.fillRect(5,-6,27,12);x.restore();x.restore()}function end(win){run=false;$('overlay').style.display='grid';$('intro').innerHTML=(win?'승리! 모든 적을 물리쳤습니다.':'패배했습니다.')+'<br>최종 점수: '+score;$('start').textContent='다시 플레이'}function loop(t){let dt=Math.min((t-last)/1000||0,.033);last=t;update(dt);draw();requestAnimationFrame(loop)}$('start').onclick=()=>{reset();run=true;$('overlay').style.display='none';last=performance.now()};$('attack').onpointerdown=e=>{e.preventDefault();held=true;fire()};['pointerup','pointercancel','pointerleave'].forEach(ev=>$('attack').addEventListener(ev,()=>held=false));$('special').onpointerdown=e=>{e.preventDefault();special()};let st=$('stick'),kn=$('knob'),sid=null;function sm(e){let r=st.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),l=Math.hypot(dx,dy),k=l>43?43/l:1;m={x:dx*k/43,y:dy*k/43};kn.style.transform=`translate(${dx*k}px,${dy*k}px)`}st.onpointerdown=e=>{sid=e.pointerId;st.setPointerCapture(sid);sm(e)};st.onpointermove=e=>{if(e.pointerId===sid)sm(e)};function release(){sid=null;m={x:0,y:0};kn.style.transform='translate(0,0)'}st.onpointerup=release;st.onpointercancel=release;addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '){e.preventDefault();fire()}});addEventListener('keyup',e=>keys[e.key]=false);reset();requestAnimationFrame(loop)})();</script></body></html>
