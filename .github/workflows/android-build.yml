name: Android app build

on:
  push:
    branches: [main, verify-android-runtime]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Validate Android JavaScript bundle
        run: npx expo export --platform android

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Build standalone release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Android emulator launch and screenshot test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r "$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/app-release.apk"
            adb logcat -c
            adb shell monkey -p com.jeongjihyun.arenabrawl 1
            sleep 15
            adb shell pidof com.jeongjihyun.arenabrawl
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/arena-basic-screen.png"
            test -s "$GITHUB_WORKSPACE/arena-basic-screen.png"
            adb logcat -d -v threadtime > "$GITHUB_WORKSPACE/arena-logcat.txt"
            if grep -E "FATAL EXCEPTION|AndroidRuntime.*(FATAL|Exception)|ReactNativeJS.*(Error|error)" "$GITHUB_WORKSPACE/arena-logcat.txt"; then
              echo "Runtime exception detected."
              exit 1
            fi
            echo "Basic React Native screen captured; app process is alive."

      - name: Upload APK and emulator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: arena-brawl-basic-android
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            arena-basic-screen.png
            arena-logcat.txt
          if-no-files-found: error
          retention-days: 7
