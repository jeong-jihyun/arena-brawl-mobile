name: Android app build

on:
  push:
    branches: [main, verify-android-runtime]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Validate Android JavaScript bundle
        run: npx expo export --platform android

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --non-interactive

      # Debug APKs expect a Metro server on the device/network.
      # A release APK embeds index.android.bundle and runs standalone.
      - name: Build standalone release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Android emulator launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell monkey -p com.jeongjihyun.arenabrawl 1
            sleep 25
            if ! adb shell pidof com.jeongjihyun.arenabrawl >/dev/null; then
              echo "Arena Brawl process exited after launch."
              adb logcat -d -v threadtime
              exit 1
            fi
            if ! adb shell dumpsys activity activities | grep -q "com.jeongjihyun.arenabrawl"; then
              echo "Arena Brawl is not present in the active Android activities."
              adb logcat -d -v threadtime
              exit 1
            fi
            echo "Arena Brawl process is alive and its activity is present after launch."
            adb shell uiautomator dump /sdcard/arena-window.xml >/dev/null
            adb shell cat /sdcard/arena-window.xml > arena-window.xml
            if ! grep -q "READY TO BRAWL?" arena-window.xml; then
              echo "Expected game start screen text was not found in the Android UI hierarchy."
              cat arena-window.xml
              adb logcat -d -v threadtime
              exit 1
            fi
            echo "Game start screen text is present in the Android UI hierarchy."
            adb logcat -d -v threadtime | grep -E "FATAL EXCEPTION|AndroidRuntime|ReactNativeJS" || true

      - name: Upload standalone release APK
        uses: actions/upload-artifact@v4
        with:
          name: arena-brawl-standalone-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
