name: Android app build

on:
  push:
    branches: [main, verify-android-runtime]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Validate Android JavaScript bundle
        run: npx expo export --platform android

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --non-interactive

      # Debug APKs expect a Metro server on the device/network.
      # A release APK embeds index.android.bundle and runs standalone.
      - name: Build standalone release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Android emulator launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r "$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/app-release.apk"
            adb logcat -c
            adb shell monkey -p com.jeongjihyun.arenabrawl 1
            sleep 20
            adb shell pidof com.jeongjihyun.arenabrawl
            adb shell uiautomator dump /sdcard/arena-startup.xml
            adb shell cat /sdcard/arena-startup.xml > "$GITHUB_WORKSPACE/arena-startup.xml"
            python -c "import xml.etree.ElementTree as E; r=E.parse('$GITHUB_WORKSPACE/arena-startup.xml').getroot(); n=next((x for x in r.iter() if x.attrib.get('text')=='게임 화면 실행'),None); print('START_BUTTON_BOUNDS='+str(n.attrib.get('bounds')) if n is not None else 'START_BUTTON_NOT_FOUND'); open('$GITHUB_WORKSPACE/tap-coordinates.txt','w').write(' '.join(__import__('re').findall(r'\\d+',n.attrib.get('bounds',''))) if n is not None else '')"
            read TAP_LEFT TAP_TOP TAP_RIGHT TAP_BOTTOM < "$GITHUB_WORKSPACE/tap-coordinates.txt"
            adb shell input tap "$(( (TAP_LEFT + TAP_RIGHT) / 2 ))" "$(( (TAP_TOP + TAP_BOTTOM) / 2 ))"
            sleep 25
            adb shell pidof com.jeongjihyun.arenabrawl
            adb shell uiautomator dump /sdcard/arena-game.xml
            adb shell cat /sdcard/arena-game.xml > "$GITHUB_WORKSPACE/arena-game.xml"
            grep -q "READY TO BRAWL?" "$GITHUB_WORKSPACE/arena-game.xml"
            adb logcat -d -v threadtime | grep -E "FATAL EXCEPTION|AndroidRuntime|ReactNativeJS" || true

      - name: Upload standalone release APK
        uses: actions/upload-artifact@v4
        with:
          name: arena-brawl-standalone-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
