name: Android app build

on:
  push:
    branches: [main, verify-android-runtime]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Validate Android JavaScript bundle
        run: npx expo export --platform android

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Build standalone release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Android emulator launch and screenshot test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096
          script: |
            set +e
            APK="$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/app-release.apk"
            adb install -r "$APK"
            INSTALL_STATUS=$?
            adb logcat -c
            adb shell am start -W -n com.jeongjihyun.arenabrawl/.MainActivity
            START_STATUS=$?
            APP_PID=""
            for attempt in $(seq 1 60); do
              APP_PID="$(adb shell pidof com.jeongjihyun.arenabrawl 2>/dev/null | tr -d '\r')"
              if [ -n "$APP_PID" ]; then break; fi
              sleep 2
            done
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/arena-basic-screen.png"
            SCREEN_STATUS=$?
            adb logcat -d -v threadtime > "$GITHUB_WORKSPACE/arena-logcat.txt"
            printf 'install_status=%s\nstart_status=%s\napp_pid=%s\nscreenshot_status=%s\n' "$INSTALL_STATUS" "$START_STATUS" "$APP_PID" "$SCREEN_STATUS" > "$GITHUB_WORKSPACE/arena-emulator-result.txt"
            test "$INSTALL_STATUS" -eq 0 && test "$START_STATUS" -eq 0 && test -n "$APP_PID" && test "$SCREEN_STATUS" -eq 0 && test -s "$GITHUB_WORKSPACE/arena-basic-screen.png"

      - name: Upload APK and emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-brawl-android-build
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            arena-basic-screen.png
            arena-logcat.txt
            arena-emulator-result.txt
          if-no-files-found: warn
          retention-days: 7
