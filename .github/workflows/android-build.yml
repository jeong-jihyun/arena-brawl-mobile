name: Android app build

on:
  push:
    branches: [main, verify-android-runtime]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Validate Android JavaScript bundle
        run: npx expo export --platform android

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --non-interactive

      # Debug APKs expect a Metro server on the device/network.
      # A release APK embeds index.android.bundle and runs standalone.
      - name: Build standalone release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Android emulator launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            APK="android/app/build/outputs/apk/release/app-release.apk"
            adb install -r "$APK"
            adb logcat -c
            adb shell monkey -p com.jeongjihyun.arenabrawl 1
            sleep 20
            if ! adb shell pidof com.jeongjihyun.arenabrawl >/dev/null; then
              echo "Arena Brawl process exited after launch."
              adb logcat -d -v threadtime
              exit 1
            fi
            adb shell uiautomator dump /sdcard/arena-startup.xml >/dev/null
            adb shell cat /sdcard/arena-startup.xml > arena-startup.xml
            python - <<'PY'
            import re
            import xml.etree.ElementTree as ET

            root = ET.parse("arena-startup.xml").getroot()
            target = next(
                (node for node in root.iter()
                 if node.attrib.get("text") == "게임 화면 실행"),
                None,
            )
            if target is None:
                print("Startup screen button was not found.")
                print(open("arena-startup.xml", encoding="utf-8").read())
                raise SystemExit(1)
            bounds = target.attrib.get("bounds", "")
            numbers = [int(value) for value in re.findall(r"-?\\d+", bounds)]
            if len(numbers) != 4:
                raise SystemExit(f"Could not parse button bounds: {bounds}")
            left, top, right, bottom = numbers
            print(f"Found game launch button at {bounds}; tapping its center.")
            with open("tap-coordinates.txt", "w", encoding="utf-8") as output:
                output.write(f"{(left + right) // 2} {(top + bottom) // 2}")
            PY
            read TAP_X TAP_Y < tap-coordinates.txt
            adb shell input tap "$TAP_X" "$TAP_Y"
            sleep 25
            if ! adb shell pidof com.jeongjihyun.arenabrawl >/dev/null; then
              echo "Arena Brawl process exited after opening the game screen."
              adb logcat -d -v threadtime
              exit 1
            fi
            adb shell uiautomator dump /sdcard/arena-game.xml >/dev/null
            adb shell cat /sdcard/arena-game.xml > arena-game.xml
            if ! grep -q "READY TO BRAWL?" arena-game.xml; then
              echo "Game screen did not expose READY TO BRAWL? after tapping the launch button."
              cat arena-game.xml
              adb logcat -d -v threadtime
              exit 1
            fi
            echo "Startup screen launched and game start screen is visible."
            adb logcat -d -v threadtime | grep -E "FATAL EXCEPTION|AndroidRuntime|ReactNativeJS" || true

      - name: Upload standalone release APK
        uses: actions/upload-artifact@v4
        with:
          name: arena-brawl-standalone-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
