name: React Native quality checks

on:
  push:
    branches: [main, game-engine-tests-ci]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript strict check
        run: npm run typecheck
      - name: Game engine unit tests
        run: npm test
